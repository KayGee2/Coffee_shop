<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="capsuleClip">
      <rect x="205" y="80" width="190" height="320" rx="95" ry="95"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="600" height="700" fill="#F5F5F0"/>

  <g stroke="#A15A2D" fill="none">

    <!-- clipped inner content -->
    <g clip-path="url(#capsuleClip)">
      <!-- sun rays -->
      <g stroke-width="3.5">
        <line x1="300" y1="205" x2="300" y2="115"/>
        <line x1="300" y1="205" x2="263" y2="122"/>
        <line x1="300" y1="205" x2="337" y2="122"/>
        <line x1="300" y1="205" x2="230" y2="145"/>
        <line x1="300" y1="205" x2="370" y2="145"/>
        <line x1="300" y1="205" x2="205" y2="180"/>
        <line x1="300" y1="205" x2="395" y2="180"/>
        <line x1="300" y1="205" x2="190" y2="222"/>
        <line x1="300" y1="205" x2="410" y2="222"/>
      </g>
      <!-- sun horizon arc -->
      <path d="M 222,222 A 78,78 0 0 1 378,222" stroke-width="4"/>

      <!-- leaves bottom -->
      <g stroke-width="3" stroke-linejoin="round">
        <!-- left branch stem -->
        <path d="M 300,402 C 272,394 248,380 224,354" stroke-width="3.5" stroke-linecap="round"/>
        <!-- left leaves (base -> tip lens shapes) -->
        <path d="M 291,398 Q 278,382 268,364 Q 286,376 291,398 Z" fill="none"/>
        <path d="M 270,384 Q 256,370 246,352 Q 264,362 270,384 Z" fill="none"/>
        <path d="M 250,368 Q 236,354 226,338 Q 244,346 250,368 Z" fill="none"/>

        <!-- right branch stem -->
        <path d="M 300,402 C 328,394 352,380 376,354" stroke-width="3.5" stroke-linecap="round"/>
        <!-- right leaves -->
        <path d="M 309,398 Q 322,382 332,364 Q 314,376 309,398 Z" fill="none"/>
        <path d="M 330,384 Q 344,370 354,352 Q 336,362 330,384 Z" fill="none"/>
        <path d="M 350,368 Q 364,354 374,338 Q 356,346 350,368 Z" fill="none"/>
      </g>
    </g>

    <!-- capsule outline (crisp, on top) -->
    <rect x="205" y="80" width="190" height="320" rx="95" ry="95" stroke-width="4"/>

    <!-- cup -->
    <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 255,240 L 255,290 A 45,40 0 0 0 345,290 L 345,240 Z"/>
      <path d="M 345,250 C 375,250 375,290 345,288"/>
    </g>

    <!-- coffee bean above cup -->
    <g stroke-width="4" stroke-linecap="round">
      <path d="M 300,205 C 275,215 272,255 300,268 C 328,255 325,215 300,205 Z"/>
      <path d="M 300,210 C 292,225 292,250 300,263"/>
    </g>
  </g>

  <!-- K&G -->
  <text x="300" y="490" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="72" fill="#A15A2D" letter-spacing="4">K&amp;G</text>

  <!-- Coffee with flanking lines -->
  <line x1="150" y1="548" x2="222" y2="548" stroke="#A15A2D" stroke-width="3"/>
  <text x="300" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#A15A2D" letter-spacing="6">COFFEE</text>
  <line x1="378" y1="548" x2="450" y2="548" stroke="#A15A2D" stroke-width="3"/>
</svg>
